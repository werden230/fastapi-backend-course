name: "Simple CI"
on: 
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Python" 
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: "poetry"

      - name: "Install poetry"
        run: pipx install poetry

      - name: "Install dependencies"
        run: poetry install --no-interaction

      - name: "Lint"
        run: poetry run ruff check

      
